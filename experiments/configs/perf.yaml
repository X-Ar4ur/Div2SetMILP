# Table 3 - BONC-style per-round metric table.
#
# This config intentionally benchmarks one cipher across consecutive rounds.
# The rendered table reports R, T_m, M_m, N_v, N_c, T_s, M_s, and Iter.,
# so the CSV source should be a single-cipher round sweep rather than a
# multi-cipher one-point efficiency matrix.
#
# To render a different cipher in Table 3, change the single run below and
# keep round_start/round_end as the round interval to be reported.

defaults:
  reduction: 1
  repeat: 3
  timer_sec: 86400
  threads_sweep: [8]
  gurobi_seed: 0

runs:
  - cipher: PRESENT
    activebits: 60
    round_start: 1
    round_end: 10
