# Table 4 — S-box inequality reduction-method ablation.
#
# For each (cipher, rounds, activebits) cell, sweep reduction methods 1..5:
#   1 greedy_sun         (Sun greedy)
#   2 sub_milp
#   3 convex_hull_tech   (Boura Alg1)
#   4 logic_cond         (Boura Alg2)
#   5 comb233            (Alg2+Alg3+Prop3)
#
# Scope: only ciphers with S-boxes (SIMON / Simeck have no S-box and would
# yield identical results across methods).
#
# Methods 6/7 are intentionally excluded for now:
#   6 superball          (requires preset superball input file)
#   7 external           (Hellman / CNF imported)
# They can be re-enabled after prerequisite-file checks are implemented.

defaults:
  repeat: 3
  timer_sec: 86400
  threads: 8
  reduction_sweep: [1, 2, 3, 4, 5]

runs:
  - { cipher: PRESENT,   rounds: 9,  activebits: 60 }
  - { cipher: Rectangle, rounds: 9,  activebits: 60 }
  - { cipher: GIFT,      rounds: 9,  activebits: 60 }
  - { cipher: LBlock,    rounds: 16, activebits: 60 }
  - { cipher: TWINE,     rounds: 16, activebits: 60 }
